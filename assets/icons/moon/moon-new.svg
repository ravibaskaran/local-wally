<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="new-corona" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="95%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <!-- Corona Ring -->
    <circle cx="12" cy="12" r="10.8" fill="url(#new-corona)">
      <animate attributeName="r" values="10.2;11.2;10.2" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Dark disc (earthshine) -->
    <circle cx="12" cy="12" r="9.5" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
    <circle cx="8" cy="9" r="1.5" fill="#1e293b" opacity="0.6"/>
    <circle cx="9" cy="14" r="2" fill="#1e293b" opacity="0.5"/>
    <circle cx="14" cy="15" r="1.2" fill="#1e293b" opacity="0.5"/>

    <!-- Outer rim shimmer -->
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="3 4">
      <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>