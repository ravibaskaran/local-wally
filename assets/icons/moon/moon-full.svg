<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <radialGradient id="full-corona" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#f8fafc" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#bae6fd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="full-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g>
    <!-- Corona -->
    <circle cx="12" cy="12" r="11.5" fill="url(#full-corona)">
      <animate attributeName="r" values="11.0;12.2;11.0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Full Moon Body -->
    <circle cx="12" cy="12" r="9.5" fill="#f8fafc" stroke="#e0f2fe" stroke-width="0.5" filter="url(#full-glow)">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Prominent Maria and Craters (Tycho, Copernicus, Oceanus Procellarum) -->
    <circle cx="10" cy="8" r="2.2" fill="#e2e8f0" opacity="0.65"/>
    <circle cx="14.5" cy="9.5" r="1.8" fill="#e2e8f0" opacity="0.6"/>
    <circle cx="14" cy="15" r="2.5" fill="#e2e8f0" opacity="0.6"/>
    <circle cx="9" cy="14" r="1.8" fill="#e2e8f0" opacity="0.55"/>
    <circle cx="12" cy="17" r="0.8" fill="#cbd5e1" opacity="0.75"/>
  </g>
</svg>