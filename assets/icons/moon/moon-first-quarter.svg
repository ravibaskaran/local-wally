<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  
  <defs>
    <filter id="moon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g>
    
    <!-- Dark disc (earthshine) -->
    <circle cx="12" cy="12" r="9.5" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
    <circle cx="8" cy="9" r="1.5" fill="#1e293b" opacity="0.6"/>
    <circle cx="9" cy="14" r="2" fill="#1e293b" opacity="0.5"/>
    <circle cx="14" cy="15" r="1.2" fill="#1e293b" opacity="0.5"/>

    <!-- First Quarter (right half illuminated) -->
    <path d="M 12 2.5 A 9.5 9.5 0 0 1 12 21.5 Z" fill="#f8fafc" filter="url(#moon-glow)">
      <animate attributeName="opacity" values="0.92;1;0.92" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="15.5" cy="10" r="1.4" fill="#cbd5e1" opacity="0.45"/>
    <circle cx="16" cy="15" r="1.6" fill="#cbd5e1" opacity="0.4"/>
    <!-- Subtle terminator pulse -->
    <line x1="12" y1="2.5" x2="12" y2="21.5" stroke="#e2e8f0" stroke-width="0.5">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>